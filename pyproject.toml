[project]
name = "upstrace"
version = "0.1.0"
description = "Trace a failed data quality check upstream to the change that caused it."
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "pandas>=2.0",
]

[project.scripts]
upstrace = "upstrace.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upstrace"]