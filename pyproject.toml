[project]
name = "upstrace"
version = "0.1.1"
description = "Trace a failed data quality check upstream to the change that caused it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ashwin Gururaj" }]
keywords = [
    "dbt",
    "data-quality",
    "data-observability",
    "duckdb",
    "lineage",
    "root-cause-analysis",
    "data-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "duckdb>=1.0",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml",
    "certifi",
    "requests>=2.31",
]

[project.scripts]
upstrace = "upstrace.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upstrace"]

[tool.hatch.build.targets.sdist]
include = [
  "src/upstrace",
  "README.md",
  "LICENSE",
]

[project.urls]
Homepage = "https://github.com/ashg2099/upstrace"
Repository = "https://github.com/ashg2099/upstrace"
Issues = "https://github.com/ashg2099/upstrace/issues"